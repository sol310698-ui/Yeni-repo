name: Android CI

# APK'lar her push'ta derlenir ve "Artifacts" bolumune yuklenir.
on:
  push:
    branches: [ "**" ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Generate Gradle wrapper (yoksa)
        run: gradle wrapper --gradle-version 8.7

      - name: Build debug APKs
        run: ./gradlew :mobile:assembleDebug :wear:assembleDebug --no-daemon --stacktrace

      - name: Upload mobile (telefon) APK
        uses: actions/upload-artifact@v4
        with:
          name: mobile-debug-apk
          path: mobile/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload wear (saat) APK
        uses: actions/upload-artifact@v4
        with:
          name: wear-debug-apk
          path: wear/build/outputs/apk/debug/*.apk
          if-no-files-found: error
