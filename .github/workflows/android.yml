name: Android CI

# Her push'ta APK'lar derlenir ve tek bir "latest" Release'e yuklenir.
# Ayni Release uzerine yazildigi icin dosyalar birikmez -> depolama dolmaz.
on:
  push:
    branches: [ "**" ]
  workflow_dispatch:

# Release olusturup guncelleyebilmek icin yazma izni gerekir.
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Generate Gradle wrapper (yoksa)
        run: gradle wrapper --gradle-version 8.7

      - name: Build debug APKs
        run: ./gradlew :mobile:assembleDebug :wear:assembleDebug --no-daemon --stacktrace

      - name: APK'lari topla ve adlandir
        run: |
          mkdir -p dist
          cp mobile/build/outputs/apk/debug/*.apk dist/telefon-mobile-debug.apk
          cp wear/build/outputs/apk/debug/*.apk   dist/saat-wear-debug.apk
          ls -l dist

      - name: latest Release olustur veya guncelle
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: En son APK'lar (latest)
          body: |
            Bu Release her push'ta otomatik guncellenir; APK'lar en son
            derlemeye aittir.

            - **telefon-mobile-debug.apk** -> telefona kur
            - **saat-wear-debug.apk** -> Wear OS saate kur

            Commit: ${{ github.sha }}
          prerelease: true
          make_latest: true
          target_commitish: ${{ github.sha }}
          files: dist/*.apk
          fail_on_unmatched_files: true
